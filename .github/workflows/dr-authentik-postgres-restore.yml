name: DR (Authentik/PostgreSQL destructive restore, R1)

# tests/dr/'s first entry: a genuinely destructive restore of
# capabilities/identity/'s own multi-tier Postgres, proving R1
# (application-data loss) with multi-tier quiescence ordering, a real
# logical-dump consistency method, and stable primary-key preservation --
# see tests/dr/authentik-postgres-restore.sh's own header and
# docs/core/recovery-model.md for the recovery contract this exists to
# prove.
#
# Nightly, not every push/PR -- unlike T-A/T-B this test destroys and
# reloads a real database as its own subject matter, on top of a full
# identity bootstrap (T-B's own ~15 minute cost) plus the destroy/quiesce/
# restore/reload sequence itself. Costly enough that gating every PR on it
# would slow ordinary iteration without buying proportionally more
# regression protection than a nightly cadence already does for a
# recovery claim that isn't expected to drift day to day. workflow_dispatch
# stays available for on-demand verification (exactly how this milestone's
# own repeated clean-run verification was performed).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  dr-authentik-postgres-restore:
    name: DR -- destroy, quiesce, restore, reload identity's own Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # TEMP diagnostic (PLAT heavy-load postgres investigation): poll for
      # postgres's own host-visible process while the test runs, and snapshot
      # its seccomp/AppArmor confinement plus cgroup CPU-throttle/memory-event
      # counters every 2s. A crashed container's process is gone by the time
      # an on-failure step runs, so this has to run concurrently with the
      # test, not after it. Remove once the heavy-load investigation concludes.
      - name: Start background postgres state watcher (TEMP diagnostic)
        run: |
          sudo rm -f /tmp/pg-watch.log
          sudo bash -c '
          while true; do
            for pid in $(ps aux | grep "[p]ostgres" | awk "{print \$2}"); do
              {
                echo "=== $(date -u +%FT%TZ) pid=$pid ($(ps -o comm= -p $pid 2>/dev/null)) ==="
                grep -i seccomp "/proc/$pid/status" 2>/dev/null
                echo "apparmor: $(cat /proc/$pid/attr/current 2>/dev/null)"
                cg=$(cut -d: -f3 "/proc/$pid/cgroup" 2>/dev/null | head -1)
                if [ -n "$cg" ]; then
                  echo "cgroup: $cg"
                  echo "cpu.stat: $(cat /sys/fs/cgroup${cg}/cpu.stat 2>/dev/null | tr "\n" " ")"
                  echo "memory.events: $(cat /sys/fs/cgroup${cg}/memory.events 2>/dev/null | tr "\n" " ")"
                fi
              } >> /tmp/pg-watch.log 2>&1
            done
            sleep 2
          done
          ' &
          disown 2>/dev/null || true
          echo "watcher started"

      - name: Run the DR rehearsal against this runner as a fresh host
        run: sh tests/dr/authentik-postgres-restore.sh

      - name: Dump postgres state watcher log (TEMP diagnostic)
        if: always()
        run: |
          echo "--- postgres seccomp/apparmor/cgroup snapshots over time ---"
          sudo cat /tmp/pg-watch.log || true

      - name: Diagnostics (on failure) -- cluster-wide state
        if: failure()
        run: |
          echo "--- flux get kustomizations -A ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml flux get kustomizations -A || true
          echo "--- kubectl get pods -A -o wide ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get pods -A -o wide || true
          echo "--- authentik server log tail ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl logs -n authentik -l app.kubernetes.io/component=server --tail=200 || true
          echo "--- authentik worker log tail ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl logs -n authentik -l app.kubernetes.io/component=worker --tail=200 || true
          echo "--- postgres log tail (current container instance) ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl logs -n authentik -l app.kubernetes.io/component=primary --tail=200 || true
          echo "--- postgres log tail (previous/crashed container instance, if any) ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl logs -n authentik -l app.kubernetes.io/component=primary --tail=200 --previous || true
          echo "--- most recent cluster events ---"
          sudo env KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get events -A --sort-by=.lastTimestamp | tail -150 || true
          echo "--- k3s service log tail ---"
          sudo journalctl -u k3s --no-pager | tail -150 || true
          echo "--- node load snapshot (TEMP diagnostic) ---"
          free -h || true
          sudo top -bn1 | head -20 || true
