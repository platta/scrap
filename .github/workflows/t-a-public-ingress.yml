name: T-A-public-ingress (capabilities/public-ingress/verify-live.sh live acceptance)

# A separate from-zero bootstrap from T-A's own -- see
# tests/profiles/t-a-public-ingress.sh's own header for why. Unlike every
# other capability, public-ingress ships no Kustomization at all
# (docs/decisions/0014-public-ingress-edge-authority.md) -- this proves
# verify-live.sh's own certificate-identity oracle is sound: green
# against this cluster's real Gateway, red against a deliberately
# different, real, ephemeral TLS endpoint the script stands up itself.
# No external account, no paid infrastructure, no router or public
# domain required. Runs on every push/PR, the same trigger tier as every
# other T-A-* profile.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  t-a-public-ingress:
    name: T-A-public-ingress -- verify-live.sh's own certificate-identity oracle, proven both ways
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Run T-A-public-ingress against this runner as a fresh host
        run: sh tests/profiles/t-a-public-ingress.sh

      - name: Diagnostics (on failure) -- cluster-wide state
        if: failure()
        run: |
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "--- flux get kustomizations -A ---"
          sudo -E flux get kustomizations -A || true
          echo "--- kubectl get pods -A -o wide ---"
          sudo -E kubectl get pods -A -o wide || true
          echo "--- the platform's own wildcard Certificate ---"
          sudo -E kubectl describe certificate -n traefik scrap-wildcard || true
          echo "--- the platform's own wildcard TLS Secret: keys and cert subject only ---"
          sudo -E kubectl get secret -n traefik scrap-wildcard-tls -o jsonpath='{.data.tls\.crt}' 2>/dev/null | base64 -d | openssl x509 -noout -subject -issuer -fingerprint -sha256 2>/dev/null || true
          echo "--- instance-config ConfigMap ---"
          sudo -E kubectl get configmap -n flux-system instance-config -o yaml || true
          echo "--- ephemeral wrong-TLS endpoint log ---"
          cat /tmp/t-a-public-ingress-wrong-tls.log 2>/dev/null || true
          echo "--- positive-run verify-live.sh output ---"
          cat /tmp/t-a-public-ingress-positive.log 2>/dev/null || true
          echo "--- negative-control verify-live.sh output ---"
          cat /tmp/t-a-public-ingress-negative.log 2>/dev/null || true
          echo "--- most recent cluster events ---"
          sudo -E kubectl get events -A --sort-by=.lastTimestamp | tail -150 || true
          echo "--- k3s service log tail ---"
          sudo journalctl -u k3s --no-pager | tail -150 || true
