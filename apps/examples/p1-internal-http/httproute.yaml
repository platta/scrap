# The entire TLS half of the application contract: nothing here names an
# issuer, a Certificate, or even mentions TLS. scrap-gateway's websecure
# listener already terminates the platform's one wildcard certificate --
# see platform/ingress/wildcard-certificate.yaml. This HTTPRoute is
# reachable at https://p1.${BASE_DOMAIN}/ with no further declaration.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p1-whoami
  namespace: scrap-examples
spec:
  parentRefs:
    - name: scrap-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "p1.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: p1-whoami
          port: 80
