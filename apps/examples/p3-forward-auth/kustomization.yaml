# namespace: is required here, unlike p2-native-oidc/'s kustomization.yaml
# -- components/forward-auth/'s Middleware is a standalone resource with
# no namespace of its own (Gateway API's extensionRef has no namespace
# field at all, so it must land in the SAME namespace as this directory's
# own HTTPRoute); this transformer is what places it there. See
# components/forward-auth/README.md's "Why namespace: is required".
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scrap-examples
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
# NEGATIVE CONTROL, DO NOT KEEP: forward-auth deliberately disabled to
# verify tests/profiles/t-b-standard.sh's T-B/p3-adversarial-unauth check
# genuinely turns red when the security invariant it claims to prove is
# actually violated -- not just when something else in the run breaks.
# Reverted immediately after one confirming CI run.
#components:
#  - ../../../components/forward-auth
