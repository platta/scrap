# Same shape as P1's HTTPRoute -- TLS, hostname routing, and (if enabled)
# forward-auth all work identically whether the backend is a pod or, as
# here, a real device on the LAN. That equivalence is the point of P6: an
# external backend joins the platform's routing/TLS surface for free.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p6-external-proxy
  namespace: scrap-examples
spec:
  parentRefs:
    - name: scrap-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "p6.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: p6-external-backend
          port: 80
