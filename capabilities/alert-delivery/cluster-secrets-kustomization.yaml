# Copy alongside cluster-kustomization.yaml -- see that file's header.
# Path says clusters/example/ because this whole repository's reference
# instance is named "example"; rename to match your own instance -- and
# edit spec.path below, from ./clusters/example/secrets/alert-delivery to
# ./clusters/<your-instance>/secrets/alert-delivery. Renaming the file
# alone does NOT change what this Kustomization reads -- see
# docs/choosing-capabilities.md.
#
# dependsOn platform-observability (not platform-secrets): the Secret
# this applies lands in the "monitoring" namespace, which
# platform-observability's own Kustomization creates unconditionally
# (platform/observability/namespace.yaml) -- nothing about Alertmanager's
# own CRDs matters for applying a plain Secret, only that the namespace
# it lands in already exists. Same reasoning
# capabilities/public-tls/cluster-secrets-kustomization.yaml's own
# comment gives for depending on platform-cert-manager instead of
# platform-cert-manager-config.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alert-delivery-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/alert-delivery
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
