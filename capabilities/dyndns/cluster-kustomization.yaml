# Copy this file (and cluster-secrets-kustomization.yaml, next to it)
# into clusters/<name>/capabilities/ to enable dyndns -- delete both to
# disable. See capabilities/README.md and docs/core/configuration-model.md
# for why a capability needing credentials is a two-file copy, not one.
#
# No dependsOn at all -- deliberately. Unlike heartbeat/alert-delivery,
# this capability has no platform-tier or other-capability dependency
# (README.md's own "no dependency on other capabilities"); it creates
# its own namespace (namespace.yaml, part of THIS Kustomization's own
# build) rather than reusing one that already exists elsewhere. The
# CronJob's own secretKeyRef is lazily resolved (only read when a Job
# actually starts on its own schedule, never at this Kustomization's own
# apply time) -- same reasoning capabilities/heartbeat/cluster-kustomization.yaml's
# own comment gives -- so this Kustomization need not (and does not)
# dependOn dyndns-secrets to be created safely; see that Kustomization's
# own comment for why the dependency instead runs the other direction.
#
# REAL BUG, found live via t-a-dyndns.sh's own CI run (its own connectivity
# diagnostics proved pod-to-host reachability was never the problem --
# a throwaway debug pod's curl to the exact same URL succeeded cleanly;
# the actual fault was this Kustomization never substituting cronjob.yaml's
# own ${DYNDNS_HOSTNAME}/${DYNDNS_NAMESERVER}/${DYNDNS_TSIG_KEY_NAME}/
# ${DYNDNS_IP_LOOKUP_URL} tokens at all -- the live CronJob's own env
# carried the literal, unsubstituted "${DYNDNS_IP_LOOKUP_URL}" string,
# confirmed by reading its spec directly): postBuild.substituteFrom is
# per-Kustomization, not inherited from the outer "capabilities"
# Kustomization that discovers this file -- capabilities/public-tls/'s
# own cluster-kustomization.yaml, which needs the identical mechanism for
# acme-issuers.yaml's own ${ACME_EMAIL} etc., already establishes this
# exact stanza; this file simply omitted it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dyndns
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./capabilities/dyndns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: instance-config
  wait: true
  timeout: 3m0s
