# Copy alongside cluster-kustomization.yaml -- see that file's header.
# Path says clusters/example/ because this whole repository's reference
# instance is named "example"; rename to match your own instance.
#
# dependsOn dyndns -- the OPPOSITE direction from
# capabilities/heartbeat/cluster-secrets-kustomization.yaml's own
# dependsOn platform-observability. That one points at a CORE namespace
# that exists no matter what; this Secret lands in "dyndns", a namespace
# ONLY this capability's own main Kustomization creates (namespace.yaml).
# Applying this Secret before that namespace exists would fail outright,
# so the dependency has to run toward the object that creates it -- the
# same "which direction depends on whether the workload starts
# immediately or lazily reads its Secret" reasoning
# docs/core/configuration-model.md's own "Capability selection" section
# gives, applied to a namespace instead of a Secret consumer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dyndns-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/dyndns
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: dyndns
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
