# namespace.yaml is included here -- unlike heartbeat/alert-delivery,
# which land in a CORE namespace that already exists unconditionally,
# this capability creates its own (README.md's own "no dependency on
# other capabilities").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cronjob.yaml
