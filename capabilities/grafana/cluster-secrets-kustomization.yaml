# OPTIONAL -- copy this alongside cluster-kustomization.yaml ONLY if
# capabilities/identity/ is ALSO enabled and you want Grafana's OIDC
# login to actually work. Grafana runs fine without it (local auth); this
# just supplies the client_secret capabilities/identity/'s own Blueprint
# already provisioned a Provider for. Path says clusters/example/ because
# this whole repository's reference instance is named "example"; rename
# to match your own instance -- and edit spec.path below, from
# ./clusters/example/secrets/grafana to ./clusters/<your-instance>/secrets/grafana.
# Renaming the file alone does NOT change what this Kustomization reads --
# see docs/choosing-capabilities.md.
#
# dependsOn platform-observability (not platform-grafana): the Secret
# this applies lands in "monitoring", which platform/observability/'s own
# Kustomization creates unconditionally -- nothing about Grafana's own
# HelmRelease needs to exist first for a plain Secret to apply.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
