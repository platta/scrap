# grafana.${BASE_DOMAIN} -- same fixed-prefix convention every other
# platform/capability hostname uses (auth.${BASE_DOMAIN}, p1.${BASE_DOMAIN},
# ...), just another name under the one wildcard certificate. Plain HTTP
# to the chart's own Service (port 80 -> container 3000); TLS terminates
# at the Gateway like everything else -- the grafana pod never sees or
# needs a certificate of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: scrap-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "grafana.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: grafana
          port: 80
