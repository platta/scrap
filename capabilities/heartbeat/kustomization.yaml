# No namespace.yaml here -- deliberately. This CronJob lands in
# "monitoring", which platform/observability/namespace.yaml already
# creates unconditionally (CORE, always present) -- same reasoning
# capabilities/alert-delivery/kustomization.yaml's own comment gives for
# the same namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cronjob.yaml
