# The declarative half of the non-negotiable requirement in this
# directory's README: everything SCRAP's supported identity behavior
# needs exists as a Blueprint here, in Git, reconciled by Flux -- never
# created only by clicking through the admin UI or a direct API call.
# Mounted at /blueprints/mounted/cm-scrap-identity-blueprints/ on both
# the server and worker pods by the chart's own `blueprints.configMaps`
# mechanism (helmrelease.yaml) -- verified against a live pod's own
# filesystem, not assumed from docs (which describe a /blueprints/custom/
# path that this chart version does not actually use). authentik
# discovers and (re)applies any *.yaml key in a mounted ConfigMap on its
# own periodic schedule -- no SCRAP-specific reload mechanism.
#
# Scope, deliberately minimal: one group or claim isn't a demo app, it's
# THE reference proof that the declarative contract genuinely works --
# see docs/decisions/0002-identity-implementation.md's obligation. It
# provisions exactly what apps/examples/'s P2 and P3 examples consume: a
# scrap-users group, an OAuth2 Provider + Application for native OIDC
# (P2), and a Proxy Provider + Application for forward-auth (P3).
#
# Provisioning a client here, in capabilities/identity/, not in apps/
# examples/p2-native-oidc/ itself, is deliberate, not a T2 shortcut: the
# application contract (docs/core/application-contract.md) states the
# client Secret for native OIDC is provided BY the identity capability,
# the same way platform/backup/ owns the restic credential rather than
# each application bringing its own -- an application never registers
# itself with an IdP; something on the IdP side always has to know about
# it first. This is that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrap-identity-blueprints
  namespace: authentik
data:
  scrap-baseline.yaml: |
    version: 1
    metadata:
      name: SCRAP - baseline identity configuration
      labels:
        blueprints.scrap.io/managed: "true"
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: scrap-users
        attrs:
          is_superuser: false

      # client_secret below is a demo value -- protects nothing real,
      # exactly like clusters/example/secrets/'s published reference
      # keypair. A real application's client Secret is a genuine secret
      # and belongs in clusters/<name>/secrets/, SOPS-encrypted, the same
      # as every other real credential in this repository.
      - id: scrap-p2-oidc-provider
        model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: scrap-p2-oidc-demo
        attrs:
          client_type: confidential
          client_id: scrap-p2-demo
          client_secret: "scrap-p2-demo-client-secret-not-sensitive"
          redirect_uris:
            - matching_mode: strict
              redirect_uri_type: authorization
              url: "https://p2.${BASE_DOMAIN}/login"
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: scrap-p2-oidc-demo
        attrs:
          name: "SCRAP native OIDC demo (P2)"
          provider: !KeyOf scrap-p2-oidc-provider

      - id: scrap-forward-auth-provider
        model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: scrap-forward-auth
        attrs:
          mode: forward_single
          external_host: "https://p3.${BASE_DOMAIN}"
          # Slugs confirmed against a live instance's own /api/v3/flows/instances/
          # -- "default-authorization-flow" (a plausible-looking guess) does
          # not exist; authentik ships separate implicit/explicit-consent
          # authorization flows instead. Implicit consent (no consent
          # screen) fits a demo/internal proxy provider.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: scrap-forward-auth-demo
        attrs:
          name: "SCRAP forward-auth demo (P3)"
          provider: !KeyOf scrap-forward-auth-provider

      # Creating a Provider does not attach it to anything that actually
      # serves it -- found live: components/forward-auth/'s Middleware
      # called the embedded outpost's real endpoint and got a bare 404,
      # because the outpost's own `providers` list was still empty.
      # `identifiers.managed` matches the fixed value the embedded
      # outpost already ships with (confirmed via
      # /api/v3/outposts/instances/), so this updates it in place rather
      # than creating a second one.
      #
      # config.authentik_host_browser -- REAL BUG, found by
      # tests/profiles/t-b-standard.sh's first successful login: with no
      # interactive admin-UI visit to auto-populate it (this whole
      # install is non-interactive, bootstrap/install.sh end to end), the
      # embedded outpost's authentik_host/authentik_host_browser stay at
      # their dataclass defaults (empty string, which authentik's own
      # request-building code falls back to "localhost" for) -- normally
      # auto-set to whatever URL an operator's browser first used to open
      # the admin dashboard, a step that never happens here. Confirmed
      # live: an unauthenticated P3 request DID get redirected (the
      # adversarial check this exists for still held), but to
      # "http://localhost/application/o/authorize/?..." -- correct for
      # nothing real, since no browser anywhere is ever at "localhost"
      # for this cluster. Setting only these two keys is safe despite
      # `attrs` fully replacing the stored config JSON: authentik reloads
      # the Outpost's config through its OutpostConfig dataclass on every
      # read (`from_dict(OutpostConfig, self._config)`), which fills
      # every other field (log_level, kubernetes_*, docker_*, all
      # irrelevant to an embedded outpost anyway) from that dataclass's
      # own defaults regardless of what the stored JSON does or doesn't
      # contain.
      - model: authentik_outposts.outpost
        state: present
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf scrap-forward-auth-provider
          config:
            authentik_host: "https://auth.${BASE_DOMAIN}"
            authentik_host_browser: "https://auth.${BASE_DOMAIN}"
