# Copy alongside cluster-kustomization.yaml -- see that file's header.
# Path says clusters/example/ because this whole repository's reference
# instance is named "example"; rename to match your own instance, exactly
# like every other clusters/example/*.yaml pointer file already assumes
# when you copy clusters/example/ itself.
#
# No dependsOn -- this Kustomization creates the authentik namespace
# itself (namespace.yaml, alongside the Secret) and needs nothing to
# exist first. cluster-kustomization.yaml (identity) dependsOn THIS one,
# not the other way around -- see that file's own comment for the live
# failure that direction produced.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: identity-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/identity
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
