# auth.${BASE_DOMAIN} -- a fixed prefix, the same convention every
# apps/examples/ HTTPRoute uses (p1.${BASE_DOMAIN}, etc.), not a separate
# instance-config variable: it's just another hostname under the one
# wildcard certificate, nothing identity-specific about how it's routed.
# Plain HTTP to the Service's own "http" port (80 -> container 9000) --
# TLS is terminated at the Gateway, same as every other application; the
# authentik-server pod never sees or needs a certificate of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  parentRefs:
    - name: scrap-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "auth.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80
