# Copy alongside cluster-kustomization.yaml -- see that file's header.
# Path says clusters/example/ because this whole repository's reference
# instance is named "example"; rename to match your own instance.
#
# dependsOn platform-cert-manager (not platform-cert-manager-config): the
# Secret this applies lands in the "cert-manager" namespace, which
# platform-cert-manager's own Kustomization creates unconditionally
# (platform/cert-manager/namespace.yaml) -- nothing about cert-manager's
# CRDs matters for applying a plain Secret, only that the namespace it
# lands in already exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: public-tls-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/public-tls
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-cert-manager
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
