# Copy alongside cluster-kustomization.yaml -- see that file's header.
# Path says clusters/example/ because this whole repository's reference
# instance is named "example"; rename to match your own instance -- and
# edit spec.path below, from ./clusters/example/secrets/ups to
# ./clusters/<your-instance>/secrets/ups. Renaming the file alone does NOT
# change what this Kustomization reads -- see docs/choosing-capabilities.md.
#
# dependsOn platform-observability (not platform-secrets): the Secret
# this applies lands in the "monitoring" namespace, which
# platform-observability's own Kustomization creates unconditionally --
# same reasoning capabilities/heartbeat/cluster-secrets-kustomization.yaml's
# own comment gives.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ups-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/ups
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
