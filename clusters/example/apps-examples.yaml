# apps/examples/ demonstrates four of the six application integration
# patterns (docs/patterns/) unconditionally: P1 (internal HTTP), P4 (raw
# TCP), P5 (stateful with a declared backup consistency method), P6
# (external LAN backend proxy). P2 (native OIDC) and P3 (forward-auth) are
# both implemented too (apps/examples/p2-native-oidc/,
# apps/examples/p3-forward-auth/) but deliberately excluded from THIS
# always-on Kustomization -- both hard-depend on capabilities/identity/
# (Authentik) being enabled, which the minimal profile this Kustomization
# serves doesn't have. See apps/examples/identity/'s own Kustomization for
# how to enable them alongside identity, and apps/examples/README.md.
#
# dependsOn platform-ingress: P1/P5/P6 all attach an HTTPRoute to
# scrap-gateway, and with wait: true Flux needs that Gateway to already
# exist for the HTTPRoute to reach Accepted -- otherwise this Kustomization
# would time out on a from-zero bootstrap, the same ordering reasoning as
# platform-ingress's own dependsOn on platform-cert-manager-config.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-examples
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/examples
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-ingress
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: instance-config
  wait: true
  timeout: 5m0s
