# Instance configuration for the `example` SCRAP instance.
#
# This is the ONLY file where these values should appear. Every manifest under
# platform/, capabilities/, and apps/ that needs one of them references it as
# ${VAR_NAME} and Flux's postBuild.substituteFrom resolves it from here.
#
# Copy this whole clusters/example/ directory to start a real instance; rename
# it, and replace every value below with your own. Do not edit this file to
# hold real values — it is the checked-in template and reference schema.
#
# CI validates: every ${VAR_NAME} referenced anywhere in the repository
# resolves to a key defined in some instance's config (this file, or another
# instance's equivalent). It does not validate that YOUR values are correct —
# that's what bootstrap/preflight/ is for, once implemented.
apiVersion: v1
kind: ConfigMap
metadata:
  name: instance-config
  namespace: flux-system
data:
  # A short, unique name identifying THIS instance -- never an application
  # name. Used as the restic --host tag on every snapshot this instance
  # writes, so that retention/prune grouping (`restic forget --group-by
  # host,paths`) can never merge two instances' snapshots into one timeline
  # even if they were accidentally pointed at the same repository. This is
  # the direct fix for a real incident: a disposable scratch instance held
  # production backup credentials, tagged its snapshots by application name
  # only, and `restic forget --prune` treated scratch and production activity
  # as one retention group. See docs/decisions/0010-backup-credential-isolation.md.
  INSTANCE_NAME: "example"

  # The base domain. The platform wildcard certificate covers
  # "*.${BASE_DOMAIN}" and "${BASE_DOMAIN}" -- see platform/cert-manager/.
  # Use a real domain you control if capabilities/public-tls/ is enabled;
  # otherwise any internal-only name works, e.g. one under RFC 8375's
  # reserved .internal namespace.
  BASE_DOMAIN: "example.internal"

  # The stable address (or resolvable name) clients use to reach this node.
  # Not necessarily a static IP -- a DHCP reservation, mDNS name, or LAN DNS
  # entry all satisfy this. Example value below is from the IPv4
  # documentation range (RFC 5737), never a real address.
  NODE_ADDRESS: "192.0.2.10"

  # IANA time zone, used for backup schedules and log timestamps.
  TIMEZONE: "Etc/UTC"

  # Which ClusterIssuer platform/ingress/'s one wildcard Certificate uses --
  # see that file's own comment. "scrap-ca" (platform/cert-manager-config/'s
  # private CA, CORE, always present) is the default in every checked-in
  # instance. Set to "scrap-acme-staging" or "scrap-acme" once
  # capabilities/public-tls/ is enabled -- staging first (Let's Encrypt's
  # staging environment has no meaningful rate limit but issues untrusted
  # certs, so DNS-01 wiring can be validated safely before cutting over to
  # the trusted, rate-limited production issuer).
  TLS_ISSUER: "scrap-ca"

  # ACME account email. Only consumed if capabilities/public-tls/ is enabled;
  # harmless to leave as a placeholder otherwise.
  ACME_EMAIL: "admin@example.internal"

  # capabilities/public-tls/'s DNS-01 solver is RFC2136 (the generic DNS
  # UPDATE protocol, not one commercial provider's API -- see that
  # capability's own README for why). Only consumed if it's enabled.
  # ACME_DNS01_NAMESERVER is the authoritative nameserver cert-manager sends
  # UPDATE requests to (host:port, port is almost always 53).
  # ACME_DNS01_TSIG_KEY_NAME names the TSIG key configured on that
  # nameserver; the key's own secret value is credential material and
  # lives in clusters/<name>/secrets/public-tls/, never here.
  ACME_DNS01_NAMESERVER: "ns.example.internal:53"
  ACME_DNS01_TSIG_KEY_NAME: "example-tsig-key"

  # Backup retention policy, passed straight to `restic forget`.
  BACKUP_RETENTION_DAILY: "7"
  BACKUP_RETENTION_WEEKLY: "4"
  BACKUP_RETENTION_MONTHLY: "6"

  # Backup destination. "local" is the minimum path (buys disk-loss recovery
  # only); a restic repository URL (e.g. an S3-compatible endpoint) is set
  # here when capabilities/offsite-backup/ is enabled -- see
  # docs/core/recovery-model.md for exactly what each choice buys.
  BACKUP_DESTINATION: "local:/var/lib/scrap-backup"

  # apps/examples/p6-external-proxy/'s demonstration backend -- a NAS, a
  # router admin UI, a hypervisor console, anything real on your LAN with
  # no identity or TLS of its own. RFC 5737 documentation address below:
  # a placeholder, like NODE_ADDRESS above, never a real one. Replace it
  # with your own device's address to make that example actually route
  # traffic; see apps/examples/p6-external-proxy/README.md.
  EXAMPLE_P6_BACKEND_ADDRESS: "203.0.113.10"

  # The real backend's own port -- "80" is the common case (a device's
  # admin UI usually is), but not universal, so it's a separate value
  # rather than assumed. tests/profiles/t-a-minimal.sh overrides both this
  # and the address above to point at a real, ephemeral backend it stands
  # up itself, to prove this pattern end to end rather than merely that
  # its objects exist.
  EXAMPLE_P6_BACKEND_PORT: "80"
