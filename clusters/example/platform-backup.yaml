# No dependsOn: this Kustomization owns the scrap-backup Namespace that
# platform-secrets' Secret needs to exist first -- see
# clusters/example/platform-secrets.yaml for why the dependency runs that
# direction, not this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-backup
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./platform/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: instance-config
  wait: true
  timeout: 5m0s
