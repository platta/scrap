# dependsOn platform-cert-manager-config (not platform-cert-manager
# directly): this Kustomization applies a Certificate
# (wildcard-certificate.yaml) referencing the scrap-ca ClusterIssuer, which
# platform-cert-manager-config owns. tests/assertions/check_kustomization_dag.py
# proves this dependency is actually declared, not merely convenient --
# the direct fix for a real class of bug where a Certificate was applied
# before its issuer was guaranteed to exist.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-ingress
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./platform/ingress
  prune: true
  sourceRef:
    kind: GitRepository
    name: scrap
  dependsOn:
    - name: platform-crds
    - name: platform-cert-manager-config
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: instance-config
  wait: true
  timeout: 5m0s
