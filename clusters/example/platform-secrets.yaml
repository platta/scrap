# Decrypts this instance's SOPS secrets -- SEPARATE from the platform-tier
# Kustomizations because it's the only one needing `decryption`, and because
# secrets are instance-specific (clusters/example/secrets/), never part of
# platform/.
#
# REAL FINDING, from actually running a from-zero bootstrap: dependsOn
# platform-backup, not the other way around, even though it looks
# backwards at first glance ("shouldn't the secret exist before the thing
# that needs it?"). It doesn't need to -- a CronJob's secretKeyRef is only
# resolved when a pod actually starts (on schedule, or when postflight
# triggers one), never at apply time. What this Secret's namespace
# (scrap-backup) genuinely needs first is the Namespace object itself,
# which platform-backup owns. Getting this backwards produced a real,
# reproducible failure: "Secret/scrap-backup/restic-credentials not
# found: namespaces \"scrap-backup\" not found".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-backup
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
