# No namespace.yaml here -- unlike clusters/example/secrets/identity/.
# This Secret lands in "monitoring", which platform/observability/
# already creates unconditionally (CORE, always present) -- same
# reasoning clusters/example/secrets/public-tls/kustomization.yaml gives
# for the "cert-manager" namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alert-delivery-credentials.sops.yaml
