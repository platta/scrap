# No namespace.yaml here -- unlike clusters/example/secrets/identity/.
# This Secret lands in "dyndns", which capabilities/dyndns/'s own main
# Kustomization creates (namespace.yaml there) -- see
# capabilities/dyndns/cluster-secrets-kustomization.yaml's own comment
# for why this pair's dependsOn direction is the opposite of
# heartbeat's/alert-delivery's own secrets Kustomizations.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dyndns-credentials.sops.yaml
