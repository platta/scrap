# A separate directory (and separate Flux Kustomization,
# capabilities/identity/cluster-secrets-kustomization.yaml) from
# ../kustomization.yaml's restic-credentials on purpose: that Kustomization
# (platform-secrets) is unconditional -- every install has platform/backup/.
# This one only exists at all once identity is enabled by copying
# capabilities/identity/'s two cluster-*-kustomization.yaml templates into
# clusters/<name>/capabilities/. If identity-credentials.sops.yaml lived
# in the same directory as restic-credentials, EVERY install -- including
# ones that never enable identity -- would get an unconditional
# "Secret/authentik/identity-credentials: namespace authentik not found"
# failure, since only this directory's own namespace.yaml creates that
# namespace -- see identity-credentials.sops.yaml, namespace.yaml, and
# capabilities/identity/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - identity-credentials.sops.yaml
