# Lives here, not in capabilities/identity/, for one reason: ordering.
# authentik's server/worker are a HelmRelease-managed Deployment, not a
# CronJob -- unlike platform/backup's restic-credentials (whose
# secretKeyRef is only resolved when a pod starts on schedule, long after
# apply time), authentik's pods start immediately when the HelmRelease
# installs and need identity-credentials to already exist. Found live:
# `CreateContainerConfigError: secret "identity-credentials" not found`,
# because this Kustomization (identity-secrets) was waiting on identity's
# Kustomization to create the namespace first -- the exact platform-
# secrets/platform-backup direction, applied here, produces a real
# deadlock instead of working, because the workload types differ. Fix:
# this Kustomization creates the namespace itself and needs nothing else
# first; identity's own Kustomization dependsOn THIS one instead.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
