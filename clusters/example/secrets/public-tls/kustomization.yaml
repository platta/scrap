# No namespace.yaml here -- unlike clusters/example/secrets/identity/.
# This Secret lands in "cert-manager", a namespace platform/cert-manager/
# already creates unconditionally (CORE, always present); nothing here
# needs to create it. See capabilities/public-tls/kustomization.yaml's
# own comment for the same reasoning.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - public-tls-credentials.sops.yaml
