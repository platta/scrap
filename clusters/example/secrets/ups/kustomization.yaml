# No namespace.yaml here -- this Secret lands in "monitoring", which
# platform/observability/ already creates unconditionally (CORE, always
# present) -- same reasoning clusters/example/secrets/heartbeat/kustomization.yaml
# and clusters/example/secrets/alert-delivery/kustomization.yaml give for
# the same namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ups-credentials.sops.yaml
