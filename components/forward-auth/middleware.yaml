# Points at authentik-server's embedded outpost directly (plain HTTP,
# in-cluster Service DNS) -- not a separately deployed outpost pod, and
# not the public https://auth.${BASE_DOMAIN} hostname either. Traefik
# calling Authentik pod-to-pod never needs to trust the platform's TLS
# certificate, private CA or not; only a browser's own request, which
# already went through the Gateway once, is involved in the public
# hostname at all. See docs/patterns/README.md#p3.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
