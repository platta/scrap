# The one backup job for the whole installation. Discovers labelled PVCs at
# run time and backs each one up -- see scripts-configmap.yaml and
# platform/backup/README.md. Nothing here is per-application; adding a
# backed-up app never touches this file (T2).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scrap-backup
  namespace: scrap-backup
spec:
  schedule: "17 2 * * *"
  timeZone: "${TIMEZONE}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # REAL BUG, found live via capabilities/offsite-backup/'s own
      # negative control: with a genuinely wrong credential against a
      # real S3 endpoint, restic's own retry/backoff behavior doesn't
      # fail fast -- the pod sat "Running" for over two minutes with no
      # sign of terminating on its own, and nothing here previously
      # bounded how long it could keep doing that. backoffLimit alone
      # doesn't help: it bounds pod RESTARTS after a container exits,
      # not how long one attempt is allowed to keep running.
      # concurrencyPolicy: Forbid means an unbounded hang here also
      # silently blocks every future scheduled run from ever starting --
      # a stuck backup becomes "no backups at all", worse than a fast,
      # visible failure. This is the direct fix: Kubernetes itself kills
      # the pod and marks the Job Failed (reason DeadlineExceeded) if one
      # attempt runs this long, converting an unbounded hang into a
      # bounded, visible failure. Instance-configurable, not hardcoded --
      # see clusters/example/instance-config.yaml's own
      # BACKUP_JOB_DEADLINE_SECONDS comment for why a fixed platform-code
      # value would have made this uneditable through any supported
      # instance seam for a real install whose backups genuinely take
      # longer than this reference instance's own tiny example workloads.
      activeDeadlineSeconds: ${BACKUP_JOB_DEADLINE_SECONDS}
      template:
        spec:
          serviceAccountName: scrap-backup
          restartPolicy: Never
          initContainers:
            # Vendors a static restic binary via a shared emptyDir rather
            # than building/maintaining a combined image -- restic/restic
            # and alpine/k8s (kubectl + sh) are both maintained upstream;
            # SCRAP composes them instead of publishing its own image.
            - name: vendor-restic
              image: restic/restic:0.19.1
              command: ["sh", "-c", "cp /usr/bin/restic /tools/restic"]
              volumeMounts:
                - name: tools
                  mountPath: /tools
          containers:
            - name: backup
              image: alpine/k8s:1.36.2
              command: ["sh", "/scripts/discover-and-backup.sh"]
              env:
                - name: PATH
                  value: "/tools:/usr/bin:/bin"
                - name: INSTANCE_NAME
                  value: "${INSTANCE_NAME}"
                - name: RESTIC_REPOSITORY
                  value: "${BACKUP_DESTINATION}"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: RESTIC_PASSWORD
                # restic's OWN generic S3-backend contract -- these are the
                # AWS SDK's standard env var names, which every S3-compatible
                # provider's client libraries (including restic's) reuse
                # regardless of vendor; not an AWS-specific mechanism and not
                # a SCRAP invention. `optional: true` (restic-credentials'
                # own key, never a capabilities/-owned secret -- see
                # capabilities/offsite-backup/README.md for why this
                # capability needs no Kustomization file of its own) means a
                # local/minimum-destination install's secret simply lacks
                # these two keys and nothing here changes -- BACKUP_DESTINATION
                # itself already fully determines behavior; these env vars
                # are inert unless it actually points at an s3: URL.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
              volumeMounts:
                - name: tools
                  mountPath: /tools
                - name: scripts
                  mountPath: /scripts
                - name: hostdata
                  mountPath: /hostdata
                  readOnly: true
                # Only exercised by the CORE local BACKUP_DESTINATION
                # default (local:/var/lib/scrap-backup). If you change that
                # path, update this mount to match -- see
                # platform/backup/README.md.
                - name: repo
                  mountPath: /var/lib/scrap-backup
          volumes:
            - name: tools
              emptyDir: {}
            - name: scripts
              configMap:
                name: scrap-backup-scripts
                defaultMode: 0o555
            - name: hostdata
              hostPath:
                path: /var/lib/rancher/k3s/storage
                type: DirectoryOrCreate
            - name: repo
              hostPath:
                path: /var/lib/scrap-backup
                type: DirectoryOrCreate
