# cert-manager: the platform's entire TLS contract. See platform/cert-manager/README.md
# and docs/decisions/0006-tls-wildcard-and-issuer-independence.md for the reasoning.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: cert-manager
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  install:
    crds: CreateReplace
    timeout: 5m
  upgrade:
    crds: CreateReplace
    timeout: 5m
  values:
    crds:
      enabled: true
    # Enables cert-manager's Gateway API HTTP-01 solver, needed only once
    # capabilities/public-tls/ is enabled (DNS-01 is the documented default
    # for that capability, but the Gateway API solver is what HTTP-01 would
    # use, and enabling it here costs nothing on the private-CA path).
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      gatewayAPI:
        enabled: true
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
    cainjector:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }
