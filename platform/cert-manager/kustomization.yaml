apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - trust-manager-helmrelease.yaml
# The private CA (ClusterIssuer/Certificate) lives in the SEPARATE
# platform/cert-manager-config/ directory, applied by its own Flux
# Kustomization with dependsOn + wait: true on this one. See that
# directory's kustomization.yaml comment for why -- it's a real,
# empirically-confirmed ordering bug, not a style preference.
