# The platform-owned host ports SCRAP claims via a LoadBalancer Service or a
# container hostPort. Checked by tests/assertions/check_reserved_ports.py on
# every pull request.
#
# Since docs/decisions/0017-p4-port-reservation-ownership.md, a P4
# (raw TCP/UDP, docs/patterns/) *application*'s own port is declared in a
# `reserved-ports.yaml` colocated with the app itself, under apps/<name>/,
# not here -- so adding a P4 app never requires touching platform/ (T2).
# check_reserved_ports.py merges both kinds into one namespace and fails if
# any two sources claim the same port.
#
# This file's port 9000 entry below predates 0017 and is a **deliberately
# unmigrated legacy entry** (see that record's "What this record leaves
# undone" for why) -- still valid, still checked, just not moved to the new
# per-app location yet. Every *new* platform-owned reservation added here
# from now on should genuinely be platform-owned (today: only 80/443, the
# ingress Gateway's own fixed ports -- also hardcoded as
# PLATFORM_FIXED_PORTS in check_reserved_ports.py for topologies where this
# file isn't present at all).
#
# This mechanism is still the direct, structural fix for a real incident: an
# ingress controller's default LoadBalancer Service silently claiming a
# host's real production ports.
reservedPorts:
  - port: 80
    protocol: TCP
    owner: platform-ingress
    note: "Traefik Gateway -- plain HTTP, used for ACME HTTP-01 challenges when public-tls is enabled via that mechanism"
  - port: 443
    protocol: TCP
    owner: platform-ingress
    note: "Traefik Gateway -- HTTPS, terminates the platform wildcard certificate"
  - port: 9000
    protocol: TCP
    owner: apps-examples
    # No literal "apps/" path here on purpose -- this file lives under
    # platform/, and check_core_boundary.py forbids platform/ from
    # referencing apps/ or capabilities/ even in a comment string. See
    # docs/patterns/README.md#p4 for the pattern this port demonstrates.
    note: "P4 pattern demo -- raw TCP echo server (docs/patterns/README.md#p4). Legacy entry predating 0017, deliberately not yet migrated -- see that record."
