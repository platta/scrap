# Baseline, cluster-wide alert rules -- zero per-application configuration
# required. An application only ships its own PrometheusRule (auto-
# discovered, no extra wiring -- see helmrelease.yaml's *SelectorNilUsesHelmValues
# settings) if it needs something beyond this baseline.
#
# The golden-path.backup group's metric names (kube_job_status_failed,
# kube_cronjob_status_last_successful_time) were confirmed against a live
# kube-state-metrics /metrics endpoint, not assumed -- see
# docs/core/recovery-model.md for why "backups silently stopped" is the
# single most important alert this baseline carries.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: golden-path-baseline
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: golden-path.pods
      rules:
        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total[15m]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
        - alert: PodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_ready{condition="false"}) > 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} has not been Ready for 15m"

    - name: golden-path.node
      rules:
        - alert: NodeDown
          expr: up{job="kube-prometheus-stack-prometheus-node-exporter"} == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "node-exporter on {{ $labels.instance }} is unreachable -- node may be down"
        - alert: NodeDiskAlmostFull
          expr: |
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} filesystem {{ $labels.mountpoint }} below 10% free"

    - name: golden-path.certs
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 86400
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} expires in under 7 days"
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="True"} == 0
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "cert-manager certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"

    - name: golden-path.backup
      rules:
        # Thresholds match each job's own schedule (platform/backup/*-cronjob.yaml)
        # with slack for one missed run: backup is daily, prune weekly, check
        # monthly. This is the alert the whole observability-core CORE
        # classification is justified on -- see docs/decisions/ §18.8: backup
        # without alerting is not a safety system.
        - alert: BackupJobFailed
          expr: kube_job_status_failed{namespace="scrap-backup"} > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "backup-engine job {{ $labels.job_name }} failed in scrap-backup"
        - alert: BackupStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="scrap-backup", cronjob="scrap-backup"} > 2 * 86400
          for: 1h
          labels: { severity: critical }
          annotations:
            summary: "the backup job has not completed successfully in over 2 days"
        - alert: BackupPruneStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="scrap-backup", cronjob="scrap-backup-prune"} > 14 * 86400
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "the backup prune job has not completed successfully in over 14 days"
        - alert: BackupCheckStale
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="scrap-backup", cronjob="scrap-backup-check"} > 45 * 86400
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "the backup integrity-check job has not completed successfully in over 45 days"
