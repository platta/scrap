# Copy into clusters/<name>/ as platform-observability-satellite-secrets.yaml
# (a NEW resource entry, added alongside your existing platform-tier
# Kustomizations in clusters/<name>/kustomization.yaml -- unlike
# cluster-kustomization.yaml, this one is additive, not a replacement).
#
# Path says clusters/example/ because this repository's reference instance
# is named "example"; rename to your own instance, same as every other
# capability's own secrets Kustomization (see docs/choosing-capabilities.md).
#
# dependsOn platform-observability (not platform-secrets): the Secret this
# applies lands in the "monitoring" namespace, which platform-observability's
# own Kustomization creates unconditionally in every topology -- same
# reasoning capabilities/heartbeat/cluster-secrets-kustomization.yaml's own
# comment gives for the identical namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: observability-satellite-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./clusters/example/secrets/observability-satellite
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-observability
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 3m0s
