# Values-level delta patch onto platform/observability/helmrelease.yaml's
# HelmRelease, matched by apiVersion/kind/metadata identity (Kustomize's
# implicit resource-ID patch target), not a JSON6902 path patch, so the
# rest of the base HelmRelease's spec.values (Grafana disabled, the
# kube* control-plane scrapers disabled, cluster-wide selectors, resource
# requests/limits) is untouched -- only the keys below are added or
# overridden.
#
# REAL BUG, found live via this profile's own CI run: an earlier version
# of this file deliberately omitted apiVersion/kind, relying purely on
# kustomization.yaml's own `patches[].target` for selection, specifically
# to dodge a check_helm_strict.py false-positive (see that script's own
# comment below). That is NOT valid input to kustomize's builtin
# PatchTransformer -- `kustomize build failed: trouble configuring
# builtin PatchTransformer with config` on the live Kustomization's own
# events, confirmed directly, not assumed. A strategic-merge patch file
# genuinely needs its own apiVersion/kind (kustomize uses them to resolve
# merge-key/list-merge behavior from the target's schema), `target:`
# or not. Restored here; the check_helm_strict.py false-positive is fixed
# at its actual source instead (see that file's own comment).
#
# retention: ADR-0018's own "a small multiple of the longest rule lookback
# window (currently 15m -- PodCrashLooping's increase(...[15m]))" -- 6h is
# generous headroom over that floor while still buying the disk savings the
# ADR states (8Gi -> ~1Gi), never claimed as the literal minimum possible.
#
# storageSpec: only the requested size differs from base; storageClassName
# and accessModes are inherited unchanged via the base HelmRelease's own
# values (CRD values merge as a plain JSON merge -- an omitted sibling key
# is preserved, never reset to a schema default).
#
# externalLabels + remoteWrite: the satellite transport contract itself
# (docs/decisions/0018-observability-topology.md's "Topology is not
# provider" section). ${INSTANCE_NAME} and ${SATELLITE_REMOTE_WRITE_URL}
# are instance-config tokens (clusters/<name>/instance-config.yaml),
# resolved by Flux's postBuild.substituteFrom before this manifest is
# applied -- same substitution mechanism every other instance-config
# token in this repository already uses.
# basicAuth's username/password come from the observability-satellite
# credential Secret (see cluster-secrets-kustomization.yaml and
# README.md's "Enabling this topology") -- credential material, never an
# instance-config scalar.
#
# The external label is named scrap_instance, deliberately NOT instance --
# Prometheus's external_labels mechanism does not override a label that
# already exists on a series, and "instance" is already Prometheus's own,
# near-universal scrape-time label (the scraped target's address) on
# almost every series a satellite has -- naming the external label
# "instance" too would silently never apply to any of them, defeating the
# entire point of tagging shipped series with this satellite's identity.
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    prometheus:
      prometheusSpec:
        retention: 6h
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 1Gi
        externalLabels:
          scrap_instance: "${INSTANCE_NAME}"
        remoteWrite:
          - name: satellite
            url: "${SATELLITE_REMOTE_WRITE_URL}"
            basicAuth:
              username:
                name: observability-satellite-credentials
                key: SATELLITE_REMOTE_WRITE_USERNAME
              password:
                name: observability-satellite-credentials
                key: SATELLITE_REMOTE_WRITE_PASSWORD
