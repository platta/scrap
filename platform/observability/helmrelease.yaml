# Prometheus + Alertmanager + kube-state-metrics + node-exporter + the
# Prometheus Operator CRDs (PodMonitor, ServiceMonitor, PrometheusRule) --
# the application metrics/alerting contract. See platform/observability/README.md
# for why this is CORE and Grafana/logs are not.
#
# Grafana is deliberately disabled here: it's capabilities/grafana/'s job,
# not core's. The golden-path PodMonitor + baseline PrometheusRule that
# consume the CRDs this chart installs live in the SEPARATE
# platform/observability-config/ Kustomization -- same reason
# platform/cert-manager-config/ is separate from platform/cert-manager/
# (a HelmRelease and a raw manifest using the CRD it installs cannot
# safely share one Flux Kustomization; see that directory's kustomization.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    crds: CreateReplace
    timeout: 10m
  upgrade:
    crds: CreateReplace
    timeout: 10m
  values:
    # k3s bundles the control plane into a single binary -- there is no
    # separate kube-apiserver/controller-manager/scheduler/proxy/etcd to
    # scrape as distinct targets the way a kubeadm cluster would have.
    kubeApiServer: { enabled: false }
    kubeControllerManager: { enabled: false }
    kubeScheduler: { enabled: false }
    kubeProxy: { enabled: false }
    kubeEtcd: { enabled: false }

    # Not core -- capabilities/grafana/ owns Grafana entirely.
    grafana:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 14d
        # Cluster-wide discovery: ANY PodMonitor/ServiceMonitor/PrometheusRule
        # is picked up, not just ones carrying this release's own label. This
        # is what makes the golden-path metrics contract "label your pod and
        # you're scraped" rather than "label your pod AND remember a
        # release-name label too."
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
        resources:
          requests: { cpu: 50m, memory: 256Mi }
          limits: { memory: 768Mi }

    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 512Mi
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { memory: 128Mi }
        # Same reasoning as podMonitorSelector/serviceMonitorSelector/
        # ruleSelector above, applied to the one remaining Prometheus
        # Operator CRD this chart owns: ANY AlertmanagerConfig is picked
        # up, cluster-wide, not just ones carrying this release's own
        # label -- these two are already the chart's own default when
        # left unset; stated explicitly so a reader doesn't have to trust
        # that. capabilities/alert-delivery/ is the one consumer today,
        # but this is a platform-level policy generalization, not
        # something built FOR that capability -- platform/ still depends
        # on nothing under capabilities/.
        alertmanagerConfigSelector: {}
        alertmanagerConfigNamespaceSelector: {}
        # NOT the chart default (OnNamespace). REAL FINDING, implementing
        # capabilities/alert-delivery/: the operator's default behavior
        # strips any matcher an AlertmanagerConfig's own route defines on
        # the `namespace` label and replaces it with an automatic
        # `namespace: <the AlertmanagerConfig's own namespace>` matcher --
        # so a delivery config living in "monitoring" would silently only
        # ever receive alerts that ALSO happen to carry
        # `namespace="monitoring"`. platform/observability-config/
        # baseline-alerts.yaml's own alerts mostly carry the ALERTING
        # WORKLOAD's namespace (scrap-backup, an app namespace, a node),
        # never "monitoring" -- under the default strategy, alert
        # delivery would appear to work (the object applies cleanly) while
        # genuinely delivering nothing for almost every real alert this
        # platform fires, the exact silent-no-op failure mode this
        # project's own baseline-alerts.yaml NodeDown comment (this same
        # file) already found once in a different selector. `None` disables
        # that automatic namespace matcher entirely, so an AlertmanagerConfig
        # is matched purely by the matchers it actually declares -- see
        # capabilities/alert-delivery/alertmanagerconfig.yaml.
        alertmanagerConfigMatcherStrategy:
          type: None
      # DELIBERATELY left at the chart's own default: route -> receiver
      # 'null', receivers: [{name: 'null'}] -- i.e. no BASE receiver
      # configured here. This is not a placeholder that silently ships
      # broken; it is a documented, honest state -- see
      # platform/observability/README.md and
      # docs/core/bootstrap-lifecycle.md's postflight step, which reports
      # this explicitly rather than letting it go unnoticed. A real
      # receiver is wired the capability way, via a namespace-scoped
      # AlertmanagerConfig object -- see capabilities/alert-delivery/ --
      # never by editing this base config, which stays chart-default for
      # every instance regardless of which capabilities it enables.
      # config: {} (chart default)

    kubeStateMetrics:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }

    nodeExporter:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }

    prometheusOperator:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits: { memory: 128Mi }
