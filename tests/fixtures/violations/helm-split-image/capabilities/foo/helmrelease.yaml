# VIOLATION: an unpinned image using Helm's own split repository:/tag:
# form, not the single-line "image: ref:tag" form. check_image_pinning.py
# must catch this -- the specific bypass an independent review found: the
# line-based regex only ever matched a single-line "image: <ref>" value,
# never a bare "image:" key whose value is a nested mapping (this exact
# shape). See that check's own comment for the fix.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foo
  namespace: foo
spec:
  chart:
    spec:
      chart: foo
      version: "1.0.0"
      sourceRef:
        kind: HelmRepository
        name: foo
        namespace: foo
  values:
    image:
      repository: ghcr.io/example/foo
      tag: latest
