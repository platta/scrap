# VIOLATION: this Kustomization applies a Certificate whose issuerRef is a
# template token (${TLS_ISSUER}) that could resolve to an issuer owned by
# cert-manager-config.yaml (same tier -- platform), but does NOT dependsOn
# it. check_kustomization_dag.py's template-token handling must catch
# this, not silently skip it as "unknown issuer, out of scope" the way a
# literal never-matching string lookup would.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress
spec:
  path: ./platform/ingress
