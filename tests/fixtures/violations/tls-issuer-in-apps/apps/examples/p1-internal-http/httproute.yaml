# Deliberately-broken fixture for
# tests/assertions/check_tls_issuer_not_in_apps.py: an application manifest
# referencing ${TLS_ISSUER}, which must never happen -- applications must
# never be coupled to which issuer the platform is currently using.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: p1-whoami
  namespace: scrap-examples
  annotations:
    example.scrap.io/current-issuer: "${TLS_ISSUER}"
spec:
  parentRefs:
    - name: scrap-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "p1.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: p1-whoami
